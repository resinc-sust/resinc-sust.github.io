{% component post_info(post) %}
<div class="post-info">
    <div class="post-header">
        <h1 class="post-title"><a href="{{ post.permalink | safe }}" style="color: inherit; text-decoration: none;">{{ post.title }}</a></h1>
        <div style="display: flex; gap: 1em; flex-wrap: wrap;">
            <span>Reading time: {{ post.reading_time }} minutes</span>
            <p>Posted at: {{ post.date | date(format="%B %e, %Y • %l:%M %p") }}</p>
        </div>
    </div>
    <div class="post-short-body">
        <p>
            {{ post.description }}
        </p>
    </div>
</div>
{% endcomponent post_info %}
